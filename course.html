<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course — KeepLearning</title><link rel="stylesheet" href="style.css">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head><body>
<header class="header"><div class="container nav">
<a class="logo" href="index.html"><span class="logo-mark">📖</span><span><strong>Keep<span>Learning</span></strong><small>Course Player</small></span></a>
<a class="btn btn-outline" href="index.html#courses">← All Courses</a>
</div></header>
<main class="course-page">
<div class="container">
<div id="courseHero" class="course-hero"><div class="loading">Loading course…</div></div>
<div id="lessonArea" class="lesson-area"></div>
</div></main>
<div id="modal" class="modal"><div class="modal-box"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://vowlzxhgjyzwzlhdgrnz.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_3ZjKK7CFwuE9kPUyiQNxlg_TMdUh3qY";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const id=new URLSearchParams(location.search).get("id");
let course=null, lessons=[], enrolled=false;

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

async function init(){
  if(!id){
    document.getElementById("courseHero").innerHTML="<p>Course not found.</p>";
    return;
  }
  const {data,error}=await sb.from("courses").select("*").eq("id",id).single();
  if(error||!data){
    document.getElementById("courseHero").innerHTML="<p>Course not found.</p>";
    return;
  }
  course=data;
  document.title=course.title+" — KeepLearning";

  const priceHtml = course.original_price && Number(course.original_price)>Number(course.price)
    ? `<s>₹${Number(course.original_price).toLocaleString("en-IN")}</s> <strong>₹${Number(course.price).toLocaleString("en-IN")}</strong> <b class="discount-badge">${Math.round((1-Number(course.price)/Number(course.original_price))*100)}% OFF</b>`
    : `₹${Number(course.price).toLocaleString("en-IN")}`;

  document.getElementById("courseHero").innerHTML=`
    <div class="course-hero-text">
      <span class="eyebrow">🎓 KeepLearning Course</span>
      <h1>${esc(course.title)}</h1>
      <p>${esc(course.description||"")}</p>
      <div class="course-meta">
        <span>⭐ ${course.rating||"5.0"}</span>
        <span>⏱ ${esc(course.duration||"Self paced")}</span>
        <span>📚 ${esc(course.level||"All levels")}</span>
      </div>
      <div class="course-price">${priceHtml} <small>/course</small></div>
      <button id="enrollBtn" class="btn btn-primary btn-lg" onclick="enroll()">Enroll / Unlock Course</button>
    </div>
    <div class="course-hero-icon">${course.thumbnail_url?`<img src="${esc(course.thumbnail_url)}" alt="">`:"💻"}</div>`;

  await loadAccess();
}

async function loadAccess(){
  const area=document.getElementById("lessonArea");
  const {data:{user}}=await sb.auth.getUser();

  if(!user){
    enrolled=false;
    area.innerHTML=`
      <div class="section-head left"><h2>Course <span>Content</span></h2></div>
      <div class="empty-state">
        <h3>🔒 Videos are locked</h3>
        <p>Login and complete the course purchase to unlock all lessons.</p>
        <button class="btn btn-primary" onclick="showLogin()">Login to Continue</button>
      </div>`;
    return;
  }

  const {data:enrollment,error:enrollError}=await sb
    .from("enrollments")
    .select("id")
    .eq("user_id",user.id)
    .eq("course_id",id)
    .maybeSingle();

  if(enrollError){
    area.innerHTML=`<div class="notice">Could not verify course access. Please try again.</div>`;
    return;
  }

  enrolled=!!enrollment;
  const btn=document.getElementById("enrollBtn");

  if(!enrolled){
    if(btn) btn.textContent="Buy / Unlock Course";
    area.innerHTML=`
      <div class="section-head left"><h2>Course <span>Content</span></h2></div>
      <div class="empty-state">
        <h3>🔒 Course Content is Locked</h3>
        <p>Purchase this course to unlock all videos and study materials.</p>
        <button class="btn btn-primary" onclick="enroll()">Buy / Unlock Course</button>
      </div>`;
    return;
  }

  if(btn) btn.textContent="✓ Course Unlocked";
  if(btn) btn.disabled=true;
  await loadLessons();
}

async function loadLessons(){
  const area=document.getElementById("lessonArea");
  const {data,error}=await sb.from("lessons")
    .select("*")
    .eq("course_id",id)
    .order("lesson_order",{ascending:true});

  if(error){
    area.innerHTML=`<div class="notice">Lessons could not be loaded. Admin may need to run setup-video-policies.sql.</div>`;
    return;
  }

  lessons=data||[];
  if(!lessons.length){
    area.innerHTML="<div class='empty-state'><h3>No lessons added yet</h3><p>Admin can add videos from the Admin Dashboard.</p></div>";
    return;
  }

  area.innerHTML=`
    <div class="section-head left">
      <h2>Course <span>Content</span></h2>
      <p>${lessons.length} lesson(s) — all unlocked</p>
    </div>
    <div class="lessons">
      ${lessons.map((l,i)=>`
        <article class="lesson">
          <div class="lesson-number">${i+1}</div>
          <div class="lesson-info">
            <h3>${esc(l.title)}</h3>
            <p>${esc(l.description||"Video lesson")}</p>
          </div>
          <div class="lesson-action">
            ${l.video_url
              ? `<button class="btn btn-primary" onclick="playVideo(${JSON.stringify(l.video_url)},${JSON.stringify(l.title)})">▶ Watch Video</button>`
              : "<span class='muted'>Video not added</span>"}
            ${l.pdf_url?`<a class="btn btn-outline" target="_blank" rel="noopener" href="${esc(l.pdf_url)}">📄 PDF</a>`:""}
          </div>
        </article>`).join("")}
    </div>`;
}

async function enroll(){
  const btn=document.getElementById("enrollBtn");
  const {data:{user}}=await sb.auth.getUser();
  if(!user){showLogin();return}
  if(enrolled)return;
  if(!window.Razorpay){alert("Payment gateway could not load. Please refresh and try again.");return}

  const oldText=btn?btn.textContent:"Buy / Unlock Course";
  if(btn){btn.disabled=true;btn.textContent="Starting secure payment…"}

  try{
    const {data:{session}}=await sb.auth.getSession();
    const accessToken=session?.access_token;
    if(!accessToken) throw new Error("Your login session has expired. Please login again.");

    const orderResp=await fetch("/api/create-order",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+accessToken},
      body:JSON.stringify({courseId:id})
    });
    const order=await orderResp.json();
    if(!orderResp.ok) throw new Error(order.error||"Could not start payment.");

    const options={
      key:order.keyId,
      amount:order.amount,
      currency:order.currency||"INR",
      name:"KeepLearning",
      description:order.courseTitle||course.title,
      order_id:order.orderId,
      prefill:{name:order.customer?.name||"",email:order.customer?.email||""},
      theme:{color:"#2563eb"},
      handler:async function(response){
        if(btn){btn.disabled=true;btn.textContent="Verifying payment…"}
        try{
          const {data:{session:currentSession}}=await sb.auth.getSession();
          const token=currentSession?.access_token;
          const verifyResp=await fetch("/api/verify-payment",{
            method:"POST",
            headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
            body:JSON.stringify({
              courseId:id,
              razorpay_order_id:response.razorpay_order_id,
              razorpay_payment_id:response.razorpay_payment_id,
              razorpay_signature:response.razorpay_signature
            })
          });
          const result=await verifyResp.json();
          if(!verifyResp.ok) throw new Error(result.error||"Payment verification failed.");
          alert("Payment successful! Your course is now unlocked.");
          location.reload();
        }catch(err){
          console.error(err);
          alert(err.message||"Payment verification failed. Please contact support if money was deducted.");
          if(btn){btn.disabled=false;btn.textContent=oldText}
        }
      },
      modal:{ondismiss:function(){if(btn){btn.disabled=false;btn.textContent=oldText}}}
    };

    const rzp=new Razorpay(options);
    rzp.on("payment.failed",function(response){
      console.error("Razorpay payment failed",response);
      alert(response.error?.description||"Payment failed. Please try again.");
      if(btn){btn.disabled=false;btn.textContent=oldText}
    });
    rzp.open();
  }catch(err){
    console.error(err);
    alert(err.message||"Unable to start payment.");
    if(btn){btn.disabled=false;btn.textContent=oldText}
  }
}

function showLogin(){
  document.getElementById("modalContent").innerHTML=`
    <h2>Login to Continue</h2>
    <p>Please login before purchasing this course.</p>
    <input id="email" type="email" placeholder="Email address">
    <input id="password" type="password" placeholder="Password">
    <button class="btn btn-primary" onclick="doLogin()">Login</button>`;
  document.getElementById("modal").classList.add("show");
}

async function doLogin(){
  const {error}=await sb.auth.signInWithPassword({
    email:document.getElementById("email").value.trim(),
    password:document.getElementById("password").value
  });
  if(error){alert(error.message);return}
  closeModal();
  location.reload();
}

function playVideo(url,title){
  let body="";
  if(/youtube\.com|youtu\.be|vimeo\.com/i.test(url)){
    let embed=url;
    if(/youtu\.be\//i.test(url)){
      const idm=url.match(/youtu\.be\/([^?&]+)/i); if(idm) embed="https://www.youtube.com/embed/"+idm[1];
    } else if(/youtube\.com\/watch/i.test(url)){
      const idm=url.match(/[?&]v=([^?&]+)/i); if(idm) embed=idm ? "https://www.youtube.com/embed/"+idm[1] : url;
    } else if(/vimeo\.com\//i.test(url) && !/player\.vimeo\.com/i.test(url)){
      const idm=url.match(/vimeo\.com\/(\d+)/i); if(idm) embed="https://player.vimeo.com/video/"+idm[1];
    }
    body=`<h2>${esc(title)}</h2><div class="video-frame"><iframe src="${esc(embed)}" title="${esc(title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
  }else{
    body=`<h2>${esc(title)}</h2><video class="video-frame" controls playsinline src="${esc(url)}"></video>`;
  }
  document.getElementById("modalContent").innerHTML=body;
  document.getElementById("modal").classList.add("show");
}

function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
init();
</script></body></html>
