<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course — KeepLearning</title><link rel="stylesheet" href="style.css">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head><body>
<header class="header course-header">
  <div class="container course-nav">
    <a class="logo" href="index.html" aria-label="KeepLearning Home">
      <span class="logo-mark">📖</span>
      <span><strong>Keep<span>Learning</span></strong><small>Course Player</small></span>
    </a>
    <div class="course-nav-actions">
      <a class="back-courses-btn" href="index.html#courses" aria-label="सर्व कोर्स">
        <span class="back-arrow">←</span><span>सर्व कोर्स</span>
      </a>
      <div id="accountArea" class="account-area">
        <button class="btn btn-outline" onclick="openSiteLogin()">Login</button>
        <button class="btn btn-primary" onclick="openSiteSignup()">Sign Up</button>
      </div>
    </div>
  </div>
</header>
<main class="course-page">
<div class="container">
<div id="courseHero" class="course-hero"><div class="loading">Loading course…</div></div>
<div id="lessonArea" class="lesson-area"></div>
</div></main>
<div id="modal" class="modal"><div class="modal-box"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<div id="shareModal" class="modal" aria-hidden="true"><div class="modal-box share-box"><button class="close" onclick="closeShareMenu()" aria-label="Close share options">×</button><div id="shareContent"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://vowlzxhgjyzwzlhdgrnz.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_3ZjKK7CFwuE9kPUyiQNxlg_TMdUh3qY";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const id=new URLSearchParams(location.search).get("id");
let course=null, lessons=[], enrolled=false;

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

async function init(){
  if(!id){
    document.getElementById("courseHero").innerHTML="<p>कोर्स सापडला नाही.</p>";
    return;
  }
  const {data,error}=await sb.from("courses").select("*").eq("id",id).single();
  if(error||!data){
    document.getElementById("courseHero").innerHTML="<p>कोर्स सापडला नाही.</p>";
    return;
  }
  course=data;
  document.title=course.title+" — KeepLearning";

  const priceHtml = course.original_price && Number(course.original_price)>Number(course.price)
    ? `<s>₹${Number(course.original_price).toLocaleString("en-IN")}</s> <strong>₹${Number(course.price).toLocaleString("en-IN")}</strong> <b class="discount-badge">${Math.round((1-Number(course.price)/Number(course.original_price))*100)}% OFF</b>`
    : `₹${Number(course.price).toLocaleString("en-IN")}`;

  document.getElementById("courseHero").innerHTML=`
    <div class="course-hero-text">
      <span class="eyebrow">🎓 KeepLearning Course</span>
      <h1>${esc(course.title)}</h1>
      <p>${esc(course.description||"")}</p>
      <div class="course-meta">
        <span>⭐ रेटिंग ${course.rating||"5.0"}</span>
        <span>⏱ कालावधी: ${esc(course.duration||"स्वतःच्या गतीने")}</span>
        <span>📚 पातळी: ${esc(course.level||"सर्व स्तर")}</span>
      </div>
      <div class="course-detail-labels"><span>📚 संपूर्ण ऑनलाइन अभ्यासक्रम</span><span>🎯 व्यावहारिक कौशल्यांवर भर</span><span>📘 अभ्यासासाठी PDF</span></div><div class="course-price">${priceHtml} <small>/ संपूर्ण कोर्स</small></div>
      <div class="course-actions">
        <button id="enrollBtn" class="btn btn-primary btn-lg" onclick="enroll()">कोर्स खरेदी करून अनलॉक करा</button>
        <button id="shareBtn" class="btn btn-share btn-lg" onclick="openShareMenu()" type="button">↗ कोर्स शेअर करा</button>
        <button id="coursePdfBtn" class="btn btn-primary btn-lg course-pdf-btn" type="button" disabled>📘 संपूर्ण कोर्स PDF डाउनलोड करा</button>
      </div>
    </div>
    <div class="course-hero-icon">${course.thumbnail_url?`<img src="${esc(course.thumbnail_url)}" alt="">`:"💻"}</div>`;

  await loadAccess();
}

async function loadAccess(){
  const area=document.getElementById("lessonArea");
  const {data:{user}}=await sb.auth.getUser();

  if(!user){
    enrolled=false;
    const pdfBtn=document.getElementById("coursePdfBtn");
    if(pdfBtn){
      pdfBtn.style.display="inline-flex";
      pdfBtn.disabled=true;
      pdfBtn.onclick=null;
      pdfBtn.title="पेमेंट पूर्ण केल्यानंतर हा पर्याय उपलब्ध होईल";
    }
    area.innerHTML=`
      <div class="section-head left"><h2>कोर्सची <span>सामग्री</span></h2></div>
      <div class="empty-state">
        <h3>🔒 कोर्सचे व्हिडिओ लॉक आहेत</h3>
        <p>सर्व व्हिडिओ धडे आणि संपूर्ण अभ्यास PDF मिळवण्यासाठी लॉगिन करून कोर्सची खरेदी पूर्ण करा.</p>
        <button class="btn btn-primary" onclick="showLogin()">पुढे जाण्यासाठी लॉगिन करा</button>
      </div>`;
    return;
  }

  const {data:enrollment,error:enrollError}=await sb
    .from("enrollments")
    .select("id")
    .eq("user_id",user.id)
    .eq("course_id",id)
    .maybeSingle();

  if(enrollError){
    area.innerHTML=`<div class="notice">Could not verify course access. Please try again.</div>`;
    return;
  }

  enrolled=!!enrollment;
  const btn=document.getElementById("enrollBtn");

  if(!enrolled){
    if(btn) btn.textContent="कोर्स खरेदी करा / अनलॉक करा";
    const pdfBtn=document.getElementById("coursePdfBtn");
    if(pdfBtn){
      pdfBtn.style.display="inline-flex";
      pdfBtn.disabled=true;
      pdfBtn.onclick=null;
      pdfBtn.title="पेमेंट पूर्ण केल्यानंतर हा पर्याय उपलब्ध होईल";
    }
    area.innerHTML=`
      <div class="section-head left"><h2>कोर्सची <span>सामग्री</span></h2></div>
      <div class="empty-state">
        <h3>🔒 कोर्सचा अभ्यासक्रम is Locked</h3>
        <p>सर्व व्हिडिओ धडे आणि अभ्यास साहित्य पाहण्यासाठी कोर्सची खरेदी पूर्ण करा.</p>
        
      </div>`;
    return;
  }

  if(btn) btn.textContent="✓ ✓ कोर्स अनलॉक झाला";
  if(btn) btn.disabled=true;
  const pdfBtn=document.getElementById("coursePdfBtn");
  if(pdfBtn){
    pdfBtn.style.display="inline-flex";
    pdfBtn.disabled=false;
    pdfBtn.title="संपूर्ण कोर्स PDF डाउनलोड करा";
    pdfBtn.onclick=async()=>{
      pdfBtn.disabled=true;
      const originalText=pdfBtn.textContent;
      pdfBtn.textContent="⏳ PDF तयार होत आहे...";
      try{
        const {data:{session}}=await sb.auth.getSession();
        const token=session?.access_token;
        if(!token) throw new Error("कृपया पुन्हा लॉगिन करा.");
        const response=await fetch("/api/download-pdf",{
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer "+token
          },
          body:JSON.stringify({courseId:id})
        });
        const result=await response.json().catch(()=>({}));
        if(!response.ok || !result.signedUrl) throw new Error(result.error||"PDF डाउनलोड करता आला नाही.");
        window.open(result.signedUrl,"_blank","noopener");
      }catch(e){
        alert(e.message||"PDF डाउनलोड करता आला नाही.");
      }finally{
        pdfBtn.disabled=false;
        pdfBtn.textContent=originalText;
      }
    };
  }
  await loadLessons();
}

async function loadLessons(){
  const area=document.getElementById("lessonArea");
  const {data,error}=await sb.from("lessons")
    .select("*")
    .eq("course_id",id)
    .order("lesson_order",{ascending:true});

  if(error){
    area.innerHTML=`<div class="notice">Lessons could not be loaded. Admin may need to run setup-video-policies.sql.</div>`;
    return;
  }

  lessons=data||[];
  if(!lessons.length){
    area.innerHTML="<div class='empty-state'><h3>No lessons added yet</h3><p>Admin can add videos from the Admin Dashboard.</p></div>";
    return;
  }

  area.innerHTML=`
    <div class="section-head left">
      <h2>कोर्सची <span>सामग्री</span></h2>
      <p>${lessons.length} धडे — सर्व अनलॉक आहेत</p>
    </div>
    <div class="lessons">
      ${lessons.map((l,i)=>`
        <article class="lesson">
          <div class="lesson-number">${i+1}</div>
          <div class="lesson-info">
            <h3>${esc(l.title)}</h3>
            <p>${esc(l.description||"Video lesson")}</p>
          </div>
          <div class="lesson-action">
            ${l.video_url
              ? `<button class="btn btn-primary" onclick="playVideo(${JSON.stringify(l.video_url)},${JSON.stringify(l.title)})">▶ व्हिडिओ पहा</button>`
              : "<span class='muted'>व्हिडिओ जोडलेला नाही</span>"}
          </div>
        </article>`).join("")}
    </div>`;
}

async function enroll(){
  const btn=document.getElementById("enrollBtn");
  const {data:{user}}=await sb.auth.getUser();
  if(!user){showLogin();return}
  if(enrolled)return;
  if(!window.Razorpay){alert("Payment gateway could not load. Please refresh and try again.");return}

  const oldText=btn?btn.textContent:"कोर्स खरेदी करा / अनलॉक करा";
  if(btn){btn.disabled=true;btn.textContent="Starting secure payment…"}

  try{
    const {data:{session}}=await sb.auth.getSession();
    const accessToken=session?.access_token;
    if(!accessToken) throw new Error("Your login session has expired. Please login again.");

    const orderResp=await fetch("/api/create-order",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+accessToken},
      body:JSON.stringify({courseId:id})
    });
    const order=await orderResp.json();
    if(!orderResp.ok) throw new Error(order.error||"Could not start payment.");

    const options={
      key:order.keyId,
      amount:order.amount,
      currency:order.currency||"INR",
      name:"KeepLearning",
      description:order.courseTitle||course.title,
      order_id:order.orderId,
      prefill:{name:order.customer?.name||"",email:order.customer?.email||""},
      theme:{color:"#2563eb"},
      handler:async function(response){
        if(btn){btn.disabled=true;btn.textContent="Verifying payment…"}
        try{
          const {data:{session:currentSession}}=await sb.auth.getSession();
          const token=currentSession?.access_token;
          const verifyResp=await fetch("/api/verify-payment",{
            method:"POST",
            headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
            body:JSON.stringify({
              courseId:id,
              razorpay_order_id:response.razorpay_order_id,
              razorpay_payment_id:response.razorpay_payment_id,
              razorpay_signature:response.razorpay_signature
            })
          });
          const result=await verifyResp.json();
          if(!verifyResp.ok) throw new Error(result.error||"पेमेंट पडताळणी अयशस्वी झाली.");
          alert("Payment successful! Your course is now unlocked.");
          location.reload();
        }catch(err){
          console.error(err);
          alert(err.message||"पेमेंट पडताळणी अयशस्वी झाली. Please contact support if money was deducted.");
          if(btn){btn.disabled=false;btn.textContent=oldText}
        }
      },
      modal:{ondismiss:function(){if(btn){btn.disabled=false;btn.textContent=oldText}}}
    };

    const rzp=new Razorpay(options);
    rzp.on("payment.failed",function(response){
      console.error("Razorpay payment failed",response);
      alert(response.error?.description||"पेमेंट अयशस्वी झाले. कृपया पुन्हा प्रयत्न करा.");
      if(btn){btn.disabled=false;btn.textContent=oldText}
    });
    rzp.open();
  }catch(err){
    console.error(err);
    alert(err.message||"Unable to start payment.");
    if(btn){btn.disabled=false;btn.textContent=oldText}
  }
}

function getCourseShareData(){
  const shareUrl=new URL("course.html",window.location.href);
  shareUrl.searchParams.set("id",id);
  return {
    url:shareUrl.href,
    title:course?.title ? course.title+" — KeepLearning" : "KeepLearning Course",
    text:course?.title ? "Check out this course on KeepLearning: "+course.title : "Check out this course on KeepLearning"
  };
}

async function nativeShare(){
  const data=getCourseShareData();
  if(!navigator.share){openShareMenu();return}
  try{
    await navigator.share(data);
  }catch(err){
    if(err?.name!="AbortError") console.warn("Share failed",err);
  }
}

async function copyCourseLink(){
  const data=getCourseShareData();
  try{
    if(navigator.clipboard?.writeText){
      await navigator.clipboard.writeText(data.url);
    }else{
      const ta=document.createElement("textarea");
      ta.value=data.url; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
    }
    showShareToast("Course link copied");
  }catch(err){
    console.error(err); showShareToast("Could not copy link. Please copy the URL from your browser.");
  }
}

function shareExternal(kind){
  const d=getCourseShareData();
  const u=encodeURIComponent(d.url), text=encodeURIComponent(d.text);
  const urls={
    whatsapp:"https://wa.me/?text="+encodeURIComponent(d.text+" "+d.url),
    telegram:"https://t.me/share/url?url="+u+"&text="+text,
    facebook:"https://www.facebook.com/sharer/sharer.php?u="+u,
    x:"https://twitter.com/intent/tweet?url="+u+"&text="+text,
    email:"mailto:?subject="+encodeURIComponent(d.title)+"&body="+encodeURIComponent(d.text+"\n\n"+d.url)
  };
  const target=urls[kind];
  if(!target)return;
  if(kind==="email"){window.location.href=target;return}
  window.open(target,"_blank","noopener,noreferrer,width=720,height=640");
}

function openShareMenu(){
  const d=getCourseShareData();
  const native=navigator.share ? `<button class="share-option share-native" onclick="nativeShare()"><span>↗</span><b>More / Phone Share</b><small>WhatsApp, Nearby Share and other apps</small></button>` : "";
  document.getElementById("shareContent").innerHTML=`
    <div class="share-heading"><div class="share-icon">↗</div><div><h2>Share this course</h2><p>Invite someone to learn with you.</p></div></div>
    ${native}
    <div class="share-grid">
      <button class="share-option" onclick="shareExternal('whatsapp')"><span>WA</span><b>WhatsApp</b><small>Share with a contact</small></button>
      <button class="share-option" onclick="shareExternal('telegram')"><span>TG</span><b>Telegram</b><small>Send to a chat</small></button>
      <button class="share-option" onclick="shareExternal('facebook')"><span>f</span><b>Facebook</b><small>Share on your profile</small></button>
      <button class="share-option" onclick="shareExternal('x')"><span>𝕏</span><b>X</b><small>Post the course</small></button>
      <button class="share-option" onclick="shareExternal('email')"><span>✉</span><b>Email</b><small>Send course details</small></button>
      <button class="share-option" onclick="copyCourseLink()"><span>⛓</span><b>Copy Link</b><small>Copy course URL</small></button>
    </div>
    <div class="share-url"><small>Course link</small><div>${esc(d.url)}</div></div>`;
  const m=document.getElementById("shareModal");
  m.classList.add("show");m.setAttribute("aria-hidden","false");
}
function closeShareMenu(){
  const m=document.getElementById("shareModal");
  m.classList.remove("show");m.setAttribute("aria-hidden","true");
}
function showShareToast(message){
  let t=document.getElementById("shareToast");
  if(!t){t=document.createElement("div");t.id="shareToast";document.body.appendChild(t)}
  t.textContent=message;t.classList.add("show");
  clearTimeout(window.__shareToastTimer);window.__shareToastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

function showLogin(){
  document.getElementById("modalContent").innerHTML=`
    <h2>पुढे जाण्यासाठी लॉगिन करा</h2>
    <p>Please login before purchasing this course.</p>
    <input id="email" type="email" placeholder="Email address">
    <input id="password" type="password" placeholder="Password">
    <button class="btn btn-primary" onclick="doLogin()">Login</button>`;
  document.getElementById("modal").classList.add("show");
}

async function doLogin(){
  const {error}=await sb.auth.signInWithPassword({
    email:document.getElementById("email").value.trim(),
    password:document.getElementById("password").value
  });
  if(error){alert(error.message);return}
  closeModal();
  await loadAccess();
  if(typeof window.refreshKeepLearningAuth==="function") await window.refreshKeepLearningAuth();
}

function playVideo(url,title){
  let body="";
  if(/youtube\.com|youtu\.be|vimeo\.com/i.test(url)){
    let embed=url;
    if(/youtu\.be\//i.test(url)){
      const idm=url.match(/youtu\.be\/([^?&]+)/i); if(idm) embed="https://www.youtube.com/embed/"+idm[1];
    } else if(/youtube\.com\/watch/i.test(url)){
      const idm=url.match(/[?&]v=([^?&]+)/i); if(idm) embed=idm ? "https://www.youtube.com/embed/"+idm[1] : url;
    } else if(/vimeo\.com\//i.test(url) && !/player\.vimeo\.com/i.test(url)){
      const idm=url.match(/vimeo\.com\/(\d+)/i); if(idm) embed="https://player.vimeo.com/video/"+idm[1];
    }
    body=`<h2>${esc(title)}</h2><div class="video-frame"><iframe src="${esc(embed)}" title="${esc(title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
  }else{
    body=`<h2>${esc(title)}</h2><video class="video-frame" controls playsinline src="${esc(url)}"></video>`;
  }
  document.getElementById("modalContent").innerHTML=body;
  document.getElementById("modal").classList.add("show");
}

function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.getElementById("shareModal").addEventListener("click",e=>{if(e.target.id==="shareModal")closeShareMenu()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeShareMenu()});
window.onKeepLearningLogout=async function(){
  enrolled=false;
  const btn=document.getElementById("enrollBtn");
  if(btn){btn.disabled=false;btn.textContent="कोर्स खरेदी करा / अनलॉक करा";}
  await loadAccess();
};
sb.auth.onAuthStateChange(function(event){
  if(event==="SIGNED_IN" || event==="SIGNED_OUT" || event==="TOKEN_REFRESHED" || event==="USER_UPDATED"){
    setTimeout(loadAccess,0);
  }
});
init();
</script><script src="auth-ui.js"></script></body></html>
