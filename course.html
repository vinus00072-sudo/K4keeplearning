<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course — KeepLearning</title><link rel="stylesheet" href="style.css">
</head><body>
<header class="header"><div class="container nav">
<a class="logo" href="index.html"><span class="logo-mark">📖</span><span><strong>Keep<span>Learning</span></strong><small>Course Player</small></span></a>
<a class="btn btn-outline" href="index.html#courses">← All Courses</a>
</div></header>
<main class="course-page">
<div class="container">
<div id="courseHero" class="course-hero"><div class="loading">Loading course…</div></div>
<div id="lessonArea" class="lesson-area"></div>
</div></main>
<div id="modal" class="modal"><div class="modal-box"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://vowlzxhgjyzwzlhdgrnz.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_3ZjKK7CFwuE9kPUyiQNxlg_TMdUh3qY";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const id=new URLSearchParams(location.search).get("id");
let course=null, lessons=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function init(){
 if(!id){document.getElementById("courseHero").innerHTML="<p>Course not found.</p>";return}
 const {data,error}=await sb.from("courses").select("*").eq("id",id).single();
 if(error||!data){document.getElementById("courseHero").innerHTML="<p>Course not found.</p>";return}
 course=data;
 document.title=course.title+" — KeepLearning";
 document.getElementById("courseHero").innerHTML=`<div class="course-hero-text"><span class="eyebrow">🎓 KeepLearning Course</span><h1>${esc(course.title)}</h1><p>${esc(course.description||"")}</p><div class="course-meta"><span>⭐ ${course.rating||"5.0"}</span><span>⏱ ${esc(course.duration||"Self paced")}</span><span>📚 ${esc(course.level||"All levels")}</span></div><div class="course-price">₹${Number(course.price).toLocaleString("en-IN")} <small>/course</small></div><button class="btn btn-primary btn-lg" onclick="enroll()">Enroll / Unlock Course</button></div><div class="course-hero-icon">${course.thumbnail_url?`<img src="${esc(course.thumbnail_url)}" alt="">`:"💻"}</div>`;
 await loadLessons();
}
async function loadLessons(){
 const area=document.getElementById("lessonArea");
 const {data,error}=await sb.from("lessons").select("*").eq("course_id",id).order("lesson_order",{ascending:true});
 if(error){area.innerHTML=`<div class="notice">Lessons are not available yet. Admin needs to add lessons and configure the lesson policy.</div>`;return}
 lessons=data||[];
 const {data:{user}}=await sb.auth.getUser();
 if(!lessons.length){area.innerHTML="<div class='empty-state'>No lessons have been added yet. The instructor/admin can add videos from the Admin Dashboard.</div>";return}
 // RLS normally returns lessons only to enrolled users. If returned, show playable lessons.
 area.innerHTML=`<div class="section-head left"><h2>Course <span>Content</span></h2><p>${lessons.length} lesson(s)</p></div><div class="lessons">${lessons.map((l,i)=>`<article class="lesson"><div class="lesson-number">${i+1}</div><div class="lesson-info"><h3>${esc(l.title)}</h3><p>${esc(l.description||"Video lesson")}</p></div><div class="lesson-action">${l.video_url?`<button class="btn btn-primary" onclick="playVideo('${esc(l.video_url)}','${esc(l.title)}')">▶ Watch Video</button>`:"<span class='muted'>Video not added</span>"}</div></article>`).join("")}</div>`;
}
async function enroll(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){showLogin();return}
 alert("Payment gateway will be connected next. After successful payment, this course will be unlocked for your account.");
}
function showLogin(){
 document.getElementById("modalContent").innerHTML=`<h2>Login to Continue</h2><p>Please login before enrolling.</p><input id="email" type="email" placeholder="Email address"><input id="password" type="password" placeholder="Password"><button class="btn btn-primary" onclick="doLogin()">Login</button>`;
 document.getElementById("modal").classList.add("show");
}
async function doLogin(){
 const {error}=await sb.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});
 if(error){alert(error.message);return} closeModal(); location.reload();
}
function playVideo(url,title){
 let safe=url.replace(/"/g,"&quot;");
 let body="";
 if(/youtube\.com|youtu\.be|vimeo\.com/i.test(url)){
   body=`<h2>${title}</h2><div class="video-frame"><iframe src="${safe}" title="${title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
 }else{
   body=`<h2>${title}</h2><video class="video-frame" controls playsinline src="${safe}"></video>`;
 }
 document.getElementById("modalContent").innerHTML=body;document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
init();
</script></body></html>
