<script>
const SUPABASE_URL="https://vowlzxhgjyzwzlhdgrnz.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_3ZjKK7CFwuE9kPUyiQNxlg_TMdUh3qY";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const id=new URLSearchParams(location.search).get("id");
let course=null, lessons=[], enrolled=false;
const HINDI_COURSE_ID="b7d4d1d7-8b7f-4b0e-9b7a-3a8b2d6c4101";
let isHindiCourse=false;
const ui={
  hi:{rating:"⭐ रेटिंग",level:"📚 स्तर",audienceTitle:"👥 यह कोर्स किन लोगों के लिए है?",audience:"यह कोर्स गृहिणियों, विद्यार्थियों, नौकरी करने वाले कर्मचारियों, उद्यमियों, छोटे-बड़े व्यवसायियों, फ्रीलांसरों, शिक्षकों, नौकरी खोजने वालों, प्रोफेशनल्स और AI सीखकर अपनी कौशल बढ़ाने वाले हर व्यक्ति के लिए उपयोगी है।",details:["📘 पूरा हिंदी प्रैक्टिकल कोर्स","💰 AI से कमाई के वास्तविक तरीके","📄 130 पेज की हिंदी PDF"],content:"कोर्स की सामग्री",lockedTitle:"🔒 कोर्स का अध्ययन सामग्री लॉक है",lockedText:"पूरी कोर्स सामग्री और अध्ययन PDF पाने के लिए खरीदारी पूरी करें।",noLessons:"इस कोर्स की मुख्य सामग्री पूरी हिंदी PDF में दी गई है।",buy:"Buy Course / Unlock",shareBtn:"↗ Share Course",pdf:"📘 Download Complete Course PDF",unlocked:"✓ ✓ Course Unlocked",login:"Login to Continue"},
  en:{rating:"⭐ Rating",level:"📚 Level",audienceTitle:"👥 Who is this course for?",audience:"This course is useful for learners who want practical skills and real-world results.",details:["📘 Complete practical course","🎯 Practical skills","📄 Course PDF"],content:"Course Content",lockedTitle:"🔒 Course Content is Locked",lockedText:"Complete your purchase to access the course content and study material.",noLessons:"No lessons have been added yet.",buy:"Buy Course / Unlock",shareBtn:"↗ Share Course",pdf:"📘 Download Complete Course PDF",unlocked:"✓ ✓ Course Unlocked",login:"Login to Continue"}
};
function T(k){return (isHindiCourse?ui.hi:ui.en)[k]||ui.en[k]||k;}


function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

async function init(){
  if(!id){
    document.getElementById("courseHero").innerHTML="<p>कोर्स सापडला नाही.</p>";
    return;
  }
  const {data,error}=await sb.from("courses").select("*").eq("id",id).single();
  if(error||!data){
    document.getElementById("courseHero").innerHTML="<p>कोर्स सापडला नाही.</p>";
    return;
  }
  course=data;
  isHindiCourse=String(course.content_language||"").toLowerCase()==="hindi" || String(course.id)===HINDI_COURSE_ID;
  document.documentElement.lang=isHindiCourse?"hi":"en";
  document.body.classList.toggle("hindi-course",isHindiCourse);
  document.title=course.title+" — KeepLearning";

  const priceHtml = course.original_price && Number(course.original_price)>Number(course.price)
    ? `<s>₹${Number(course.original_price).toLocaleString("en-IN")}</s> <strong>₹${Number(course.price).toLocaleString("en-IN")}</strong> <b class="discount-badge">${Math.round((1-Number(course.price)/Number(course.original_price))*100)}% OFF</b>`
    : `₹${Number(course.price).toLocaleString("en-IN")}`;

  document.getElementById("courseHero").innerHTML=`
    <div class="course-hero-text">
      <span class="eyebrow">🎓 KeepLearning Course</span>
      <h1>${esc(course.title)}</h1>
      <p>${esc(course.description||"")}</p>
      <div class="course-meta">
        <span>${T("rating")} ${course.rating||"5.0"}</span>
        <span>${T("level")}: ${esc(course.level||"All Levels")}</span>
      </div>
      <div class="course-audience-box">
        <strong>${T("audienceTitle")}</strong>
        <p>${T("audience")}</p>
      </div>
      <div class="course-detail-labels">${T("details").map(x=>`<span>${x}</span>`).join("")}</div><div class="course-price">${priceHtml} <small>/ Full Course</small></div>
      <div class="course-actions">
        <button id="enrollBtn" class="btn btn-primary btn-lg" onclick="enroll()">${T("buy")}</button>
        <button id="shareBtn" class="btn btn-share btn-lg" onclick="openShareMenu()" type="button">${T("shareBtn")}</button>
        <button id="coursePdfBtn" class="btn btn-primary btn-lg course-pdf-btn" type="button" disabled>${T("pdf")}</button>
      </div>
    </div>
    <div class="course-hero-icon">${course.thumbnail_url?`<img src="${esc(course.thumbnail_url)}" alt="">`:"💻"}</div>`;

  await loadAccess();
}

async function loadAccess(){
  const area=document.getElementById("lessonArea");
  const {data:{user}}=await sb.auth.getUser();

  if(!user){
    enrolled=false;
    const pdfBtn=document.getElementById("coursePdfBtn");
    if(pdfBtn){
      pdfBtn.style.display="inline-flex";
      pdfBtn.disabled=true;
      pdfBtn.onclick=null;
      pdfBtn.title="Available after successful payment";
    }
    area.innerHTML=`
      <div class="section-head left"><h2>${T("content")}</h2></div>
      <div class="empty-state">
        <h3>${T("lockedTitle")}</h3>
        <p>${T("lockedText")}</p>
        <button class="btn btn-primary" onclick="showLogin()">${T("login")}</button>
      </div>`;
    return;
  }

  const {data:enrollment,error:enrollError}=await sb
    .from("enrollments")
    .select("id")
    .eq("user_id",user.id)
    .eq("course_id",id)
    .maybeSingle();

  if(enrollError){
    area.innerHTML=`<div class="notice">Could not verify course access. Please try again.</div>`;
    return;
  }

  enrolled=!!enrollment;
  const btn=document.getElementById("enrollBtn");

  if(!enrolled){
    if(btn) btn.textContent=T("buy");
    const pdfBtn=document.getElementById("coursePdfBtn");
    if(pdfBtn){
      pdfBtn.style.display="inline-flex";
      pdfBtn.disabled=true;
      pdfBtn.onclick=null;
      pdfBtn.title="Available after successful payment";
    }
    area.innerHTML=`
      <div class="section-head left"><h2>${T("content")}</h2></div>
      <div class="empty-state">
        <h3>${T("lockedTitle")}</h3>
        <p>${T("lockedText")}</p>
      </div>`;
    return;
  }

  if(btn) btn.textContent=T("unlocked");
  if(btn) btn.disabled=true;
  const pdfBtn=document.getElementById("coursePdfBtn");
  if(pdfBtn){
    pdfBtn.style.display="inline-flex";
    pdfBtn.disabled=false;
    pdfBtn.title="Download complete course PDF";
    pdfBtn.onclick=async()=>{
      pdfBtn.disabled=true;
      const originalText=pdfBtn.textContent;
      pdfBtn.textContent="⏳ Preparing PDF...";
      try{
        const {data:{session}}=await sb.auth.getSession();
        const token=session?.access_token;
        if(!token) throw new Error("Please login again.");
        const response=await fetch("/api/download-pdf",{
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer "+token
          },
          body:JSON.stringify({courseId:id})
        });
        const result=await response.json().catch(()=>({}));
        if(!response.ok || !result.signedUrl) throw new Error(result.error||"Unable to download PDF.");
        window.open(result.signedUrl,"_blank","noopener");
      }catch(e){
        alert(e.message||"Unable to download PDF.");
      }finally{
        pdfBtn.disabled=false;
        pdfBtn.textContent=originalText;
      }
    };
  }
  await loadLessons();
}

async function loadLessons(){
  const area=document.getElementById("lessonArea");
  const {data,error}=await sb.from("lessons")
    .select("*")
    .eq("course_id",id)
    .order("lesson_order",{ascending:true});

  if(error){
    area.innerHTML=`<div class="notice">Lessons could not be loaded. Admin may need to run setup-video-policies.sql.</div>`;
    return;
  }

  lessons=data||[];
  if(!lessons.length){
    area.innerHTML=`<div class='empty-state'><h3>${T("noLessons")}</h3><p>${isHindiCourse?"इस कोर्स की मुख्य सामग्री पूरी हिंदी PDF में उपलब्ध है।":"Admin can add videos from the Admin Dashboard."}</p></div>`;
    return;
  }

  area.innerHTML=`
    <div class="section-head left">
      <h2>${T("content")}</h2>
      <p>${lessons.length} ${isHindiCourse?"अध्याय — सभी अनलॉक हैं":"lessons — all unlocked"}</p>
    </div>
    <div class="lessons">
      ${lessons.map((l,i)=>`
        <article class="lesson">
          <div class="lesson-number">${i+1}</div>
          <div class="lesson-info">
            <h3>${esc(l.title)}</h3>
            <p>${esc(l.description||"Video lesson")}</p>
          </div>
          <div class="lesson-action">
            ${l.video_url
              ? `<button class="btn btn-primary" onclick="playVideo(${JSON.stringify(l.video_url)},${JSON.stringify(l.title)})">▶ व्हिडिओ पहा</button>`
              : "<span class='muted'>Video not added</span>"}
          </div>
        </article>`).join("")}
    </div>`;
}

  document.getElementById("modal").classList.add("show");
  setTimeout(()=>document.getElementById("purchaseName")?.focus(),100);

function showPurchaseLogin(message=""){
  document.getElementById("modalContent").innerHTML=`
    <div class="purchase-signup" style="text-align:left">
      <div style="text-align:center;font-size:42px;margin-bottom:8px">🔐</div>
      <h2 style="text-align:center">Login करून Payment सुरू करा</h2>
      <p style="text-align:center;color:#64748b">तुमचे खाते आधीच आहे. Login केल्यानंतर तुम्ही थेट payment कडे जाल.</p>
      ${message ? `<div style="background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:12px;margin:14px 0;font-size:14px">${esc(message)}</div>` : ""}
      <div style="display:grid;gap:12px;margin:18px 0">

      <p style="font-size:14px;text-align:center;margin-top:14px">नवीन खाते हवे आहे? <a href="#" onclick="showPurchaseSignup();return false"><strong>खाते तयार करा</strong></a></p>
    </div>`;
  document.getElementById("modal").classList.add("show");

async function createPurchaseAccount(){
  const name=document.getElementById("purchaseName")?.value.trim();
  const mobile=document.getElementById("purchaseMobile")?.value.trim().replace(/\D/g,"");
  const email=document.getElementById("purchaseEmail")?.value.trim().toLowerCase();
  const password=document.getElementById("purchasePassword")?.value||"";
  const btn=document.getElementById("purchaseSignupBtn");
  if(!name||!email||!password||!mobile){alert("कृपया सर्व माहिती भरा.");return}
  if(name.length<2){alert("कृपया योग्य पूर्ण नाव टाका.");return}
  if(!/^[6-9]\d{9}$/.test(mobile)){alert("कृपया योग्य 10 अंकी मोबाईल नंबर टाका.");return}
  if(password.length<6){alert("Password किमान 6 characters असावा.");return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){alert("कृपया योग्य Email address टाका.");return}
  if(btn){btn.disabled=true;btn.textContent="खाते तयार होत आहे..."}
  try{
    const {data,error}=await sb.auth.signUp({
      email,
      password,
      options:{data:{full_name:name,mobile:mobile}}
    });
    if(error){
      const msg=String(error.message||"").toLowerCase();
      if(msg.includes("already registered")||msg.includes("already been registered")||msg.includes("user already exists")){
        showPurchaseLogin("या Email वर आधीच खाते आहे. कृपया Login करा; तुमचा course purchase flow तिथूनच पुढे सुरू होईल.");
        return;
      }
      throw error;
    }

    // If Supabase email confirmation is enabled, there is no authenticated
    // session yet and starting a payment would be unsafe/impossible.
    if(!data?.session){
      document.getElementById("modalContent").innerHTML=`
        <div style="text-align:center;padding:10px">
          <div style="font-size:52px">📧</div>
          <h2>खाते तयार झाले!</h2>
          <p>तुमच्या Email वर confirmation link पाठवली आहे. Email confirm केल्यानंतर खालील बटण दाबा.</p>
          <button class="btn btn-primary" onclick="showPurchaseLogin()">Email Confirm केल्यानंतर Login करा</button>
          <p style="font-size:13px;color:#64748b;margin-top:12px">Security साठी Email confirmation पूर्ण होईपर्यंत payment सुरू केले जाणार नाही.</p>
        </div>`;
      return;
    }

    await finishPurchaseSignupAndPay();
  }catch(e){
    console.error("Purchase signup failed",e);
    if(btn){btn.disabled=false;btn.textContent="खाते तयार करा आणि Payment कडे जा"}
    const raw=String(e.message||"");
    if(/invalid.*email|email.*invalid/i.test(raw)) alert("कृपया योग्य Email address टाका.");
    else if(/password/i.test(raw)) alert("Password किमान 6 characters असावा.");
    else alert(raw||"Account तयार करता आले नाही. कृपया पुन्हा प्रयत्न करा.");
  }
}

async function finishPurchaseSignupAndPay(){
  const courseName=esc(course?.title||"हा कोर्स");
  document.getElementById("modalContent").innerHTML=`
    <div style="text-align:center;padding:10px">
      <div style="font-size:52px">✅</div>
      <h2>खाते यशस्वीपणे तयार झाले!</h2>
      <p><strong>${courseName}</strong> साठी secure payment सुरू करत आहोत...</p>
      <div style="margin-top:14px;color:#64748b;font-size:14px">कृपया payment window बंद करू नका.</div>
    </div>`;
  if(typeof window.refreshKeepLearningAuth==="function") await window.refreshKeepLearningAuth();
  await new Promise(resolve=>setTimeout(resolve,700));
  closeModal();
  await loadAccess();
  await enroll();
}

async function purchaseLoginAndPay(){
  const email=document.getElementById("purchaseLoginEmail")?.value.trim().toLowerCase();
  const password=document.getElementById("purchaseLoginPassword")?.value||"";
  const btn=document.getElementById("purchaseLoginBtn");
  if(!email||!password){alert("कृपया Email आणि Password भरा.");return}
  if(btn){btn.disabled=true;btn.textContent="Login होत आहे..."}
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error) throw error;
    if(!data?.session) throw new Error("Login session तयार झाली नाही. कृपया पुन्हा प्रयत्न करा.");
    await finishPurchaseSignupAndPay();
  }catch(e){
    console.error("Purchase login failed",e);
    if(btn){btn.disabled=false;btn.textContent="Login आणि Payment कडे जा"}
    alert(e.message||"Login करता आले नाही. कृपया Email आणि Password तपासा.");
  }
}

async function enroll(){
  const btn=document.getElementById("enrollBtn");
  const {data:{user}}=await sb.auth.getUser();
  if(!user){showPurchaseSignup();return}
  if(enrolled)return;
  if(!window.Razorpay){alert("Payment gateway could not load. Please refresh and try again.");return}

  const oldText=btn?btn.textContent:"कोर्स खरेदी करा / अनलॉक करा";
  if(btn){btn.disabled=true;btn.textContent="Starting secure payment…"}

  try{
    const {data:{session}}=await sb.auth.getSession();
    const accessToken=session?.access_token;
    if(!accessToken) throw new Error("Your login session has expired. Please login again.");

    const orderResp=await fetch("/api/create-order",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+accessToken},
      body:JSON.stringify({courseId:id})
    });
    const order=await orderResp.json();
    if(!orderResp.ok) throw new Error(order.error||"Could not start payment.");

    const options={
      key:order.keyId,
      amount:order.amount,
      currency:order.currency||"INR",
      name:"KeepLearning",
      description:order.courseTitle||course.title,
      order_id:order.orderId,
      prefill:{name:order.customer?.name||"",email:order.customer?.email||""},
      theme:{color:"#2563eb"},
      handler:async function(response){
        if(btn){btn.disabled=true;btn.textContent="Verifying payment…"}
        try{
          const {data:{session:currentSession}}=await sb.auth.getSession();
          const token=currentSession?.access_token;
          const verifyResp=await fetch("/api/verify-payment",{
            method:"POST",
            headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
            body:JSON.stringify({
              courseId:id,
              razorpay_order_id:response.razorpay_order_id,
              razorpay_payment_id:response.razorpay_payment_id,
              razorpay_signature:response.razorpay_signature
            })
          });
          const result=await verifyResp.json();
          if(!verifyResp.ok) throw new Error(result.error||"पेमेंट पडताळणी अयशस्वी झाली.");
          // Meta Pixel: record a Purchase only after server-side payment verification succeeds.
          if (typeof fbq === "function") {
            fbq("track", "Purchase", {
              value: Number(order.amount || 0) / 100,
              currency: order.currency || "INR",
              content_name: order.courseTitle || course.title,
              content_type: "product",
              content_ids: [String(id)]
            });
          }
          alert("Payment successful! Your course is now unlocked.");
          location.reload();
        }catch(err){
          console.error(err);
          alert(err.message||"पेमेंट पडताळणी अयशस्वी झाली. Please contact support if money was deducted.");
          if(btn){btn.disabled=false;btn.textContent=oldText}
        }
      },
      modal:{ondismiss:function(){if(btn){btn.disabled=false;btn.textContent=oldText}}}
    };

    const rzp=new Razorpay(options);
    rzp.on("payment.failed",function(response){
      console.error("Razorpay payment failed",response);
      alert(response.error?.description||"पेमेंट अयशस्वी झाले. कृपया पुन्हा प्रयत्न करा.");
      if(btn){btn.disabled=false;btn.textContent=oldText}
    });
    rzp.open();
  }catch(err){
    console.error(err);
    alert(err.message||"Unable to start payment.");
    if(btn){btn.disabled=false;btn.textContent=oldText}
  }
}

function getCourseShareData(){
  const shareUrl=new URL("course.html",window.location.href);
  shareUrl.searchParams.set("id",id);
  return {
    url:shareUrl.href,
    title:course?.title ? course.title+" — KeepLearning" : "KeepLearning Course",
    text:course?.title ? "Check out this course on KeepLearning: "+course.title : "Check out this course on KeepLearning"
  };
}

async function nativeShare(){
  const data=getCourseShareData();
  if(!navigator.share){openShareMenu();return}
  try{
    await navigator.share(data);
  }catch(err){
    if(err?.name!="AbortError") console.warn("Share failed",err);
  }
}

async function copyCourseLink(){
  const data=getCourseShareData();
  try{
    if(navigator.clipboard?.writeText){
      await navigator.clipboard.writeText(data.url);
    }else{
      const ta=document.createElement("textarea");
      ta.value=data.url; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
    }
    showShareToast("Course link copied");
  }catch(err){
    console.error(err); showShareToast("Could not copy link. Please copy the URL from your browser.");
  }
}

function shareExternal(kind){
  const d=getCourseShareData();
  const u=encodeURIComponent(d.url), text=encodeURIComponent(d.text);
  const urls={
    whatsapp:"https://wa.me/?text="+encodeURIComponent(d.text+" "+d.url),
    telegram:"https://t.me/share/url?url="+u+"&text="+text,
    facebook:"https://www.facebook.com/sharer/sharer.php?u="+u,
    x:"https://twitter.com/intent/tweet?url="+u+"&text="+text,
    email:"mailto:?subject="+encodeURIComponent(d.title)+"&body="+encodeURIComponent(d.text+"\n\n"+d.url)
  };
  const target=urls[kind];
  if(!target)return;
  if(kind==="email"){window.location.href=target;return}
  window.open(target,"_blank","noopener,noreferrer,width=720,height=640");
}

function openShareMenu(){
  const d=getCourseShareData();
  const native=navigator.share ? `<button class="share-option share-native" onclick="nativeShare()"><span>↗</span><b>More / Phone Share</b><small>WhatsApp, Nearby Share and other apps</small></button>` : "";
  document.getElementById("shareContent").innerHTML=`
    <div class="share-heading"><div class="share-icon">↗</div><div><h2>Share this course</h2><p>Invite someone to learn with you.</p></div></div>
    ${native}
    <div class="share-grid">
      <button class="share-option" onclick="shareExternal('whatsapp')"><span>WA</span><b>WhatsApp</b><small>Share with a contact</small></button>
      <button class="share-option" onclick="shareExternal('telegram')"><span>TG</span><b>Telegram</b><small>Send to a chat</small></button>
      <button class="share-option" onclick="shareExternal('facebook')"><span>f</span><b>Facebook</b><small>Share on your profile</small></button>
      <button class="share-option" onclick="shareExternal('x')"><span>𝕏</span><b>X</b><small>Post the course</small></button>
      <button class="share-option" onclick="shareExternal('email')"><span>✉</span><b>Email</b><small>Send course details</small></button>
      <button class="share-option" onclick="copyCourseLink()"><span>⛓</span><b>Copy Link</b><small>Copy course URL</small></button>
    </div>
    <div class="share-url"><small>Course link</small><div>${esc(d.url)}</div></div>`;
  const m=document.getElementById("shareModal");
  m.classList.add("show");m.setAttribute("aria-hidden","false");
}
function closeShareMenu(){
  const m=document.getElementById("shareModal");
  m.classList.remove("show");m.setAttribute("aria-hidden","true");
}
function showShareToast(message){
  let t=document.getElementById("shareToast");
  if(!t){t=document.createElement("div");t.id="shareToast";document.body.appendChild(t)}
  t.textContent=message;t.classList.add("show");
  clearTimeout(window.__shareToastTimer);window.__shareToastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

function showLogin(){
  document.getElementById("modalContent").innerHTML=`
    <h2>पुढे जाण्यासाठी लॉगिन करा</h2>
    <p>Please login before purchasing this course.</p>
    <input id="email" type="email" placeholder="Email address">
    <input id="password" type="password" placeholder="Password">
    <button class="btn btn-primary" onclick="doLogin()">Login</button>`;
  document.getElementById("modal").classList.add("show");
}

async function doLogin(){
  const {error}=await sb.auth.signInWithPassword({
    email:document.getElementById("email").value.trim(),
    password:document.getElementById("password").value
  });
  if(error){alert(error.message);return}
  closeModal();
  await loadAccess();
  if(typeof window.refreshKeepLearningAuth==="function") await window.refreshKeepLearningAuth();
}

function playVideo(url,title){
  let body="";
  if(/youtube\.com|youtu\.be|vimeo\.com/i.test(url)){
    let embed=url;
    if(/youtu\.be\//i.test(url)){
      const idm=url.match(/youtu\.be\/([^?&]+)/i); if(idm) embed="https://www.youtube.com/embed/"+idm[1];
    } else if(/youtube\.com\/watch/i.test(url)){
      const idm=url.match(/[?&]v=([^?&]+)/i); if(idm) embed=idm ? "https://www.youtube.com/embed/"+idm[1] : url;
    } else if(/vimeo\.com\//i.test(url) && !/player\.vimeo\.com/i.test(url)){
      const idm=url.match(/vimeo\.com\/(\d+)/i); if(idm) embed="https://player.vimeo.com/video/"+idm[1];
    }
    body=`<h2>${esc(title)}</h2><div class="video-frame"><iframe src="${esc(embed)}" title="${esc(title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
  }else{
    body=`<h2>${esc(title)}</h2><video class="video-frame" controls playsinline src="${esc(url)}"></video>`;
  }
  document.getElementById("modalContent").innerHTML=body;
  document.getElementById("modal").classList.add("show");
}

function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.getElementById("shareModal").addEventListener("click",e=>{if(e.target.id==="shareModal")closeShareMenu()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeShareMenu()});
window.onKeepLearningLogout=async function(){
  enrolled=false;
  const btn=document.getElementById("enrollBtn");
  if(btn){btn.disabled=false;btn.textContent="कोर्स खरेदी करा / अनलॉक करा";}
  await loadAccess();
};
sb.auth.onAuthStateChange(function(event){
  if(event==="SIGNED_IN" || event==="SIGNED_OUT" || event==="TOKEN_REFRESHED" || event==="USER_UPDATED"){
    setTimeout(loadAccess,0);
  }
});
init();
